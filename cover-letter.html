<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jareth Thomas | Cover Letter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Source+Sans+3:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body
    data-resume-src="cover-letter.json"
    data-document-type="cover-letter"
    data-resume-template="modern"
    data-page-title="Jareth Thomas | Cover Letter"
    data-brand="Jareth Thomas"
    data-brand-subtitle="Cover Letter"
  >
    <header class="topbar no-print">
      <div class="topbar-inner">
        <div>
          <strong class="brand">Jareth Thomas</strong>
          <p class="brand-sub">Cover Letter</p>
        </div>
        <div class="topbar-actions">
          <a class="btn btn-quiet" href="index.html">
            <i class="fa-solid fa-file-lines"></i>
            <span>Resume</span>
          </a>
          <a class="btn btn-quiet" href="amazon-cover-letter.html">
            <i class="fa-solid fa-box"></i>
            <span>Amazon Letter</span>
          </a>
          <button id="editLetterBtn" class="btn btn-quiet" type="button">
            <i class="fa-solid fa-pen-to-square"></i>
            <span>Edit Letter</span>
          </button>
          <button id="themeBtn" class="btn btn-quiet" type="button" aria-label="Toggle theme">
            <i class="fa-solid fa-moon"></i>
            <span>Dark</span>
          </button>
          <button id="printBtn" class="btn" type="button">
            <i class="fa-solid fa-file-pdf"></i>
            <span>Export PDF</span>
          </button>
        </div>
      </div>
    </header>

    <main class="portfolio" id="resumeRoot" aria-live="polite"></main>

    <script src="script.js"></script>
  </body>
</html>
