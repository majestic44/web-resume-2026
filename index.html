<!DOCTYPE html>
<html lang="en">
  <head>
    <meta name="robots" content="noindex, nofollow">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jareth Thomas Resume</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell no-print">
      <div class="toolbar">
        <div>
          <strong>Web Resume Starter</strong>
          <span class="toolbar-sub">Modern single-page resume with PDF export</span>
        </div>
        <div class="toolbar-actions">
          <button id="printBtn">Export PDF</button>
        </div>
      </div>
    </div>

    <main class="resume" id="resumeRoot" aria-live="polite"></main>

    <script src="script.js"></script>
  </body>
</html>
