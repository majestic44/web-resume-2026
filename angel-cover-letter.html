<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Angel Cunningham | Cover Letter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body
    data-resume-src="angel-cover-letter.json"
    data-document-type="cover-letter"
    data-resume-template="classic"
    data-page-title="Angel Cunningham | Cover Letter"
    data-brand="Angel Cunningham"
    data-brand-subtitle="Cover Letter"
  >
    <header class="topbar no-print">
      <div class="topbar-inner">
        <div>
          <strong class="brand">Angel Cunningham</strong>
          <p class="brand-sub">Cover Letter</p>
        </div>
        <div class="topbar-actions">
          <nav class="topbar-group" aria-label="Profile pages">
            <a class="btn btn-quiet" href="index.html">
              <i class="fa-solid fa-address-card"></i>
              <span>Profiles</span>
            </a>
            <a class="btn btn-quiet" href="angel.html">
              <i class="fa-solid fa-file-lines"></i>
              <span>Resume</span>
            </a>
          </nav>
          <div class="topbar-group topbar-tools" aria-label="Cover letter tools">
            <button id="adminUnlockBtn" class="btn btn-quiet" type="button" aria-label="Unlock editing">
              <i class="fa-solid fa-lock"></i>
              <span>Unlock</span>
            </button>
            <button id="editLetterBtn" class="btn btn-quiet admin-only" type="button" data-admin-only>
              <i class="fa-solid fa-pen-to-square"></i>
              <span>Edit Letter</span>
            </button>
            <button id="themeBtn" class="btn btn-quiet" type="button" aria-label="Toggle theme">
              <i class="fa-solid fa-moon"></i>
              <span>Dark</span>
            </button>
            <button id="printBtn" class="btn" type="button">
              <i class="fa-solid fa-file-pdf"></i>
              <span>Export PDF</span>
            </button>
          </div>
        </div>
      </div>
    </header>

    <main class="portfolio" id="resumeRoot" aria-live="polite"></main>

    <script src="script.js"></script>
  </body>
</html>
